esphome:
  name: example-pid-autotune

esp32:
  board: esp32dev

wifi:
  ap:

logger:

sensor:
  - platform: template
    id: pid_fan_temperature_source
    lambda: return 25.0;
    unit_of_measurement: "°C"
    update_interval: 10s

packages:
  i18n: github://oxynatOr/esphome-configs/i18n/en.yaml@v0.1.0
  pwm: github://oxynatOr/esphome-configs/hardware/controllers/fan-pwm-ledc.yaml@v0.1.0
  autotune: github://oxynatOr/esphome-configs/hardware/controllers/pid-autotune.yaml@v0.1.0
