# Purpose:       WiFi with a static IP and fallback access point. Override the addresses in your own config.
# Requires:      secrets wifi_ssid, wifi_password, wifi_ap_password
# Chip:          any
# Substitutions:
#   wifi_static_ip:       192.0.2.10    - device address (documentation range, replace it)
#   wifi_gateway:         192.0.2.1     - gateway address
#   wifi_subnet:          255.255.255.0 - subnet mask
#   wifi_dns1:            192.0.2.1     - DNS server
#   wifi_fast_connect:    false - connect to the last known network without scanning
#   wifi_power_save_mode: LIGHT - NONE, LIGHT or HIGH
#   wifi_min_auth_mode:   WPA2  - lowest accepted authentication mode
#   wifi_hidden:          false - true if the network does not broadcast its SSID
substitutions:
  wifi_static_ip: 192.0.2.10
  wifi_gateway: 192.0.2.1
  wifi_subnet: 255.255.255.0
  wifi_dns1: 192.0.2.1
  wifi_fast_connect: "false"
  wifi_power_save_mode: LIGHT
  wifi_min_auth_mode: WPA2
  wifi_hidden: "false"

wifi:
  fast_connect: ${wifi_fast_connect}
  power_save_mode: ${wifi_power_save_mode}
  min_auth_mode: ${wifi_min_auth_mode}
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      hidden: ${wifi_hidden}
      manual_ip:
        static_ip: ${wifi_static_ip}
        gateway: ${wifi_gateway}
        subnet: ${wifi_subnet}
        dns1: ${wifi_dns1}
  ap:
    password: !secret wifi_ap_password

captive_portal:
