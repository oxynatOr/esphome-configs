# Purpose:       Shelly Power Strip 4 Gen4 with four switched outlets, per-outlet metering, buttons and LED ring. Adoptable in the ESPHome dashboard.
# Requires:      all packages below, i18n/en.yaml
# Chip:          esp32-c6
# Substitutions: none (for the install over OTA from the stock firmware add hardware/plugs/power-strip/ota-stock-layout.yaml, see docs/power-strip-v4.md)
esphome:
  name: power-strip-v4
  friendly_name: Shelly Power Strip 4 Gen4
  project:
    name: "ioxys.power-strip-v4"
    version: "0.1.0"

dashboard_import:
  package_import_url: github://oxynatOr/esphome-configs/projects/power-strip/v4.yaml@v0.1.0
  import_full_config: false

wifi:
  ap:

captive_portal:

packages:
  i18n_base: github://oxynatOr/esphome-configs/i18n/en.yaml@v0.1.0
  hardware: github://oxynatOr/esphome-configs/hardware/plugs/power-strip/v4.yaml@v0.1.0
  logger: github://oxynatOr/esphome-configs/core/logger.yaml@v0.1.0
  api: github://oxynatOr/esphome-configs/core/api.yaml@v0.1.0
  ota: github://oxynatOr/esphome-configs/core/ota.yaml@v0.1.0
  safe_mode: github://oxynatOr/esphome-configs/core/safe-mode.yaml@v0.1.0
  diag_uptime: github://oxynatOr/esphome-configs/hardware/diagnostics/uptime.yaml@v0.1.0
  diag_wifi: github://oxynatOr/esphome-configs/hardware/diagnostics/wifi.yaml@v0.1.0
  diag_esp32: github://oxynatOr/esphome-configs/hardware/diagnostics/esp32.yaml@v0.1.0
