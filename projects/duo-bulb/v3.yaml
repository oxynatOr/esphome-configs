# Purpose:       Shelly Duo Bulb E27 Gen3: warm and cold white light (2700-6500 K). Adoptable in the ESPHome dashboard.
# Requires:      all packages below, i18n/en.yaml
# Chip:          esp32-c3
# Substitutions: none (for the install over OTA from the stock firmware add hardware/lights/duo-bulb/ota-stock-layout.yaml, see docs/duo-bulb-v3.md)
esphome:
  name: duo-bulb-v3
  friendly_name: Shelly Duo Bulb Gen3
  project:
    name: "ioxys.duo-bulb-v3"
    version: "0.1.0"

dashboard_import:
  package_import_url: github://oxynatOr/esphome-configs/projects/duo-bulb/v3.yaml@v0.1.0
  import_full_config: false

wifi:
  ap:

captive_portal:

packages:
  i18n_base: github://oxynatOr/esphome-configs/i18n/en.yaml@v0.1.0
  hardware: github://oxynatOr/esphome-configs/hardware/lights/duo-bulb/v3.yaml@v0.1.0
  logger: github://oxynatOr/esphome-configs/core/logger.yaml@v0.1.0
  api: github://oxynatOr/esphome-configs/core/api.yaml@v0.1.0
  ota: github://oxynatOr/esphome-configs/core/ota.yaml@v0.1.0
  safe_mode: github://oxynatOr/esphome-configs/core/safe-mode.yaml@v0.1.0
  diag_wifi: github://oxynatOr/esphome-configs/hardware/diagnostics/wifi.yaml@v0.1.0
