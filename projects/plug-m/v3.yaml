# Purpose:       Shelly Plug M Gen3 with protection, status LED, energy counters, calibration and diagnostics. Adoptable in the ESPHome dashboard.
# Requires:      all packages below, i18n/en.yaml
# Chip:          esp32-c3
# Substitutions: none (override plug_* values in your adopted config to change limits)
esphome:
  name: plug-m-v3
  friendly_name: Shelly Plug M Gen3
  project:
    name: "ioxys.plug-m-v3"
    version: "0.1.0"

dashboard_import:
  package_import_url: github://oxynatOr/esphome-configs/projects/plug-m/v3.yaml@v0.1.0
  import_full_config: false

wifi:
  ap:

captive_portal:

packages:
  i18n_base: github://oxynatOr/esphome-configs/i18n/en.yaml@v0.1.0
  hardware: github://oxynatOr/esphome-configs/hardware/plugs/plug-m/v3.yaml@v0.1.0
  logger: github://oxynatOr/esphome-configs/core/logger.yaml@v0.1.0
  api: github://oxynatOr/esphome-configs/core/api.yaml@v0.1.0
  ota: github://oxynatOr/esphome-configs/core/ota.yaml@v0.1.0
  safe_mode: github://oxynatOr/esphome-configs/core/safe-mode.yaml@v0.1.0
  time: github://oxynatOr/esphome-configs/core/time-homeassistant.yaml@v0.1.0
  protection: github://oxynatOr/esphome-configs/hardware/plugs/common/relay-protection.yaml@v0.1.0
  status: github://oxynatOr/esphome-configs/hardware/plugs/common/status.yaml@v0.1.0
  led: github://oxynatOr/esphome-configs/hardware/plugs/plug-m/led-status.yaml@v0.1.0
  energy: github://oxynatOr/esphome-configs/hardware/power-monitoring/energy-counters.yaml@v0.1.0
  calibration: github://oxynatOr/esphome-configs/hardware/power-monitoring/bl0942-calibration.yaml@v0.1.0
  diag_uptime: github://oxynatOr/esphome-configs/hardware/diagnostics/uptime.yaml@v0.1.0
  diag_wifi: github://oxynatOr/esphome-configs/hardware/diagnostics/wifi.yaml@v0.1.0
  diag_esp32: github://oxynatOr/esphome-configs/hardware/diagnostics/esp32.yaml@v0.1.0
  night: github://oxynatOr/esphome-configs/hardware/plugs/addons/night.yaml@v0.1.0
  autooff: github://oxynatOr/esphome-configs/hardware/plugs/addons/autooff.yaml@v0.1.0
  plug_diagnostics: github://oxynatOr/esphome-configs/hardware/plugs/addons/diagnostics.yaml@v0.1.0
