# Purpose:       Shelly Plug S Gen3 with protection, status LED, energy counters, calibration and diagnostics. Adoptable in the ESPHome dashboard.
# Requires:      all packages below, i18n/en.yaml
# Chip:          esp32-c3
# Substitutions: none (override plug_* values in your adopted config to change limits)
esphome:
  name: plug-s-v3
  friendly_name: Shelly Plug S Gen3
  project:
    name: "ioxys.plug-s-v3"
    version: "0.0.0"

dashboard_import:
  package_import_url: github://OWNER/ioxys-esphome/projects/plug-s/v3.yaml@v0.0.0
  import_full_config: false

wifi:
  ap:

captive_portal:

packages:
  i18n_base: github://OWNER/ioxys-esphome/i18n/en.yaml@v0.0.0
  hardware: github://OWNER/ioxys-esphome/hardware/plugs/plug-s/v3.yaml@v0.0.0
  logger: github://OWNER/ioxys-esphome/core/logger.yaml@v0.0.0
  api: github://OWNER/ioxys-esphome/core/api.yaml@v0.0.0
  ota: github://OWNER/ioxys-esphome/core/ota.yaml@v0.0.0
  safe_mode: github://OWNER/ioxys-esphome/core/safe-mode.yaml@v0.0.0
  time: github://OWNER/ioxys-esphome/core/time-homeassistant.yaml@v0.0.0
  protection: github://OWNER/ioxys-esphome/hardware/plugs/common/relay-protection.yaml@v0.0.0
  status: github://OWNER/ioxys-esphome/hardware/plugs/common/status.yaml@v0.0.0
  led: github://OWNER/ioxys-esphome/hardware/plugs/plug-s/led-status.yaml@v0.0.0
  energy: github://OWNER/ioxys-esphome/hardware/power-monitoring/energy-counters.yaml@v0.0.0
  calibration: github://OWNER/ioxys-esphome/hardware/power-monitoring/bl0942-calibration.yaml@v0.0.0
  diag_uptime: github://OWNER/ioxys-esphome/hardware/diagnostics/uptime.yaml@v0.0.0
  diag_wifi: github://OWNER/ioxys-esphome/hardware/diagnostics/wifi.yaml@v0.0.0
  diag_esp32: github://OWNER/ioxys-esphome/hardware/diagnostics/esp32.yaml@v0.0.0
  button: github://OWNER/ioxys-esphome/hardware/plugs/plug-s/button.yaml@v0.0.0
  night: github://OWNER/ioxys-esphome/hardware/plugs/addons/night.yaml@v0.0.0
  autooff: github://OWNER/ioxys-esphome/hardware/plugs/addons/autooff.yaml@v0.0.0
  plug_diagnostics: github://OWNER/ioxys-esphome/hardware/plugs/addons/diagnostics.yaml@v0.0.0
