# Purpose:       Light effect "Daylight (sun)": colour temperature and brightness follow the real sun (needs your coordinates). UNTESTED on the bulb.
# Requires:      a light with id bulb (platform rgbw_ct_table), core/time-homeassistant.yaml, i18n/en.yaml
# Chip:          any
# Substitutions:
#   daylight_lat / daylight_lon:    51.0 / 9.0 - degrees north / east, CHANGE THIS (the defaults are roughly the middle of Germany)
#   daylight_start_elev:            -4 - degrees: the effect starts here (dim, warm)
#   daylight_peak_elev:             40 - degrees: full brightness and the coolest colour from here upwards
#   daylight_warm_k / daylight_cool_k: 2700 / 5500, daylight_min_brightness: 0.25, daylight_step: 60s, daylight_fade: 5000 - as in daylight.yaml
#
# Can be used together with daylight.yaml (fixed times). Warm and dim at the horizon, bright and cool at daylight_peak_elev degrees and higher.
# Below daylight_start_elev (a bit under the horizon, about the end of the evening twilight) nothing is changed. Provides the sun component
# (id ha_sun) that night-sun.yaml needs. If you use it with daylight.yaml, set the shared values once in your own substitutions.
substitutions:
  daylight_lat: "51.0"           # degrees north, CHANGE THIS
  daylight_lon: "9.0"            # degrees east, CHANGE THIS
  daylight_start_elev: "-4"      # degrees: the effect starts here (dim, warm)
  daylight_peak_elev: "40"       # degrees: full brightness and the coolest colour from here upwards
  daylight_warm_k: "2700"
  daylight_cool_k: "5500"
  daylight_min_brightness: "0.25"
  daylight_step: "60s"
  daylight_fade: "5000"

sun:
  id: ha_sun
  latitude: ${daylight_lat}
  longitude: ${daylight_lon}
  time_id: homeassistant_time

light:
  - id: !extend bulb
    effects:
      - lambda:
          name: ${txt_light_effect_daylight_sun}
          update_interval: ${daylight_step}
          lambda: |-
              if (!id(homeassistant_time).now().is_valid()) { ESP_LOGW("daylight_sun", "time not valid yet, waiting for Home Assistant"); return; }
              const float elev = (float) id(ha_sun).elevation();
              const float e0 = ${daylight_start_elev}, e1 = ${daylight_peak_elev};
              if (elev < e0) return;                      // sun too far below the horizon: leave the lamp alone
              // k: 0 at e0, 1 at e1 and above (smooth ramp)
              float x = (elev - e0) / (e1 - e0);
              if (x > 1.0f) x = 1.0f;
              const float k = x * x * (3.0f - 2.0f * x);
              const float minb = ${daylight_min_brightness};
              const float kelvin = ${daylight_warm_k} + (${daylight_cool_k} - ${daylight_warm_k}) * k;
              const float br = minb + (1.0f - minb) * k;
              ESP_LOGD("daylight_sun", "elevation %.1f: %.0f K, brightness %.2f", elev, kelvin, br);
              auto call = id(bulb).turn_on();
              call.set_color_mode(esphome::light::ColorMode::COLOR_TEMPERATURE);
              call.set_color_temperature(1000000.0f / kelvin);
              call.set_brightness(br);
              call.set_transition_length(${daylight_fade});
              call.set_publish(false);
              call.set_save(false);
              call.perform();
