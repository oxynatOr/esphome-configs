# Purpose:       Light effect "Night (time)": a dim warm light between two clock times (over midnight is fine). UNTESTED on the bulb.
# Requires:      a light with id bulb (platform rgbw_ct_table), core/time-homeassistant.yaml, i18n/en.yaml
# Chip:          any
# Substitutions:
#   night_start / night_end:        21:30 / 06:30 - HH:MM, local time
#   night_brightness:               0.05 - 0..1
#   night_k:                        2700 - kelvin (2700 = the white LED alone, the warmest the lamp can do)
#   night_step:                     60s - how often the effect sets the lamp
#   night_fade:                     3000 - ms, fade time of each change
#
# While the effect is selected and the time is inside the window, the lamp is set once a minute to night_k at night_brightness. Outside the window
# nothing is changed. Choosing a colour or brightness by hand ends the effect. For the night light that follows the sun use night-sun.yaml.
# The bulb module uses gamma 1.0 (as the stock firmware), so 5 % is about 51 of 1023 steps and clearly visible. With gamma_correct 2.8, 5 % is below
# one step and the lamp stays DARK: then add dim-range.yaml as well or raise night_brightness to about 0.10.
substitutions:
  night_start: "21:30"        # HH:MM, local time
  night_end: "06:30"
  night_brightness: "0.05"    # 0..1
  night_k: "2700"             # colour temperature in kelvin (2700 = the white LED alone, the warmest the lamp can do)
  night_step: "60s"           # how often the effect sets the lamp
  night_fade: "3000"          # ms, fade time of each change

light:
  - id: !extend bulb
    effects:
      - lambda:
          name: ${txt_light_effect_night_time}
          update_interval: ${night_step}
          lambda: |-
              auto now = id(homeassistant_time).now();
              if (!now.is_valid()) { ESP_LOGW("night", "time not valid yet, waiting for Home Assistant"); return; }
              int hs = 0, ms = 0, he = 0, me = 0;
              sscanf("${night_start}", "%d:%d", &hs, &ms);
              sscanf("${night_end}", "%d:%d", &he, &me);
              const int s = hs * 60 + ms, e = he * 60 + me;
              const int m = now.hour * 60 + now.minute;
              const bool inside = (s < e) ? (m >= s && m < e) : (m >= s || m < e);   // s >= e: the night goes over midnight
              if (!inside) return;
              auto call = id(bulb).turn_on();
              call.set_color_mode(esphome::light::ColorMode::COLOR_TEMPERATURE);
              call.set_color_temperature(1000000.0f / ${night_k});
              call.set_brightness(${night_brightness});
              call.set_transition_length(${night_fade});
              call.set_publish(false);
              call.set_save(false);
              call.perform();
