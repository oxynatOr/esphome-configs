# Purpose:       Button gestures: click toggles the relay, double click selects the next effect, triple click engages the child lock, long press acknowledges a fault.
# Requires:      plug-s/v3.yaml, plug-s/led-status.yaml, relay-protection.yaml
# Chip:          esp32
# Substitutions:
#   plug_max_temp: used to refuse acknowledging a fault while still too hot (relay-protection.yaml)
globals:
  # Ignore the 2.5 s "long press" that would otherwise follow the unlock gesture
  - id: gesture_suppress_until
    type: uint32_t
    restore_value: false
    initial_value: "0"

script:
  # Double click: switch to the next effect
  - id: next_effect
    mode: restart
    then:
      - lambda: |-
          id(effect_idx) = (id(effect_idx) + 1) % 3;
      - script.execute: apply_effect

binary_sensor:
  - platform: gpio
    id: "push_button"
    name: ${txt_plug_button}
    internal: true
    pin:
      number: GPIO18
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 5ms
    on_multi_click:
      # ---- 1x click: toggle relay -------------------------------------
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.35s
        then:
          - if:
              condition:
                switch.is_on: button_lock
              then:
                - script.execute:
                    id: show_fx
                    kind: 1
              else:
                - if:
                    condition:
                      switch.is_on: fault_lock
                    then:
                      - script.execute:
                          id: show_fx
                          kind: 2
                      - logger.log:
                          level: WARN
                          format: "Button pressed while fault lock is active"
                    else:
                      - switch.toggle: relay

      # ---- 2x click: next effect --------------------------------------
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at most 0.4s
          - OFF for at least 0.35s
        then:
          - if:
              condition:
                switch.is_on: button_lock
              then:
                - script.execute:
                    id: show_fx
                    kind: 1
              else:
                - script.execute: next_effect

      # ---- 3x click: child lock ON ------------------------------------
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at most 0.4s
          - OFF for at least 0.35s
        then:
          - switch.turn_on: button_lock
          - script.execute:
              id: show_fx
              kind: 3
          - logger.log:
              level: INFO
              format: "Child lock engaged"

      # ---- 3x click, hold the last press: child lock OFF --------------
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at least 1.5s
        then:
          - switch.turn_off: button_lock
          - lambda: |-
              id(gesture_suppress_until) = millis() + 6000;
          - script.execute:
              id: show_fx
              kind: 4
          - logger.log:
              level: INFO
              format: "Child lock released"

      # ---- hold 2.5 s: acknowledge fault, otherwise LEDs on/off --------
      - timing:
          - ON for at least 2.5s
        then:
          - if:
              condition:
                lambda: 'return (int32_t)(id(gesture_suppress_until) - millis()) > 0;'
              then:
                - logger.log:
                    level: DEBUG
                    format: "Long press ignored (part of the unlock gesture)"
              else:
                - if:
                    condition:
                      switch.is_on: button_lock
                    then:
                      - script.execute:
                          id: show_fx
                          kind: 1
                    else:
                      - if:
                          condition:
                            switch.is_on: fault_lock
                          then:
                            - if:
                                condition:
                                  lambda: 'return !(id(ntc_temp).state >= ${plug_max_temp});'
                                then:
                                  - switch.turn_off: fault_lock
                                  - logger.log:
                                      level: INFO
                                      format: "Fault acknowledged by long press"
                                else:
                                  - script.execute:
                                      id: show_fx
                                      kind: 2
                                  - logger.log:
                                      level: WARN
                                      format: "Cannot acknowledge: still too hot"
                          else:
                            - if:
                                condition:
                                  light.is_on: rgb_lights
                                then:
                                  - light.turn_off: rgb_lights
                                else:
                                  - script.execute: apply_effect
