# Purpose:       Makes the firmware installable via OTA from the stock Shelly firmware (partition layout).
# Requires:      plug-m/v3.yaml
# Chip:          esp32-c3
# Substitutions: none
#
# Additional config: makes the firmware installable via OTA from the stock Shelly firmware
# (Free-Shelly-OTA). Merge it into config.yaml, e.g. with `packages:`.
# Needs PlugMG3-stock.csv (Shelly's stock partition layout) next to your YAML file.

esp32:
  flash_size: 8MB
  partitions: PlugMG3-stock.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      # The stock Shelly keeps the partition table at 0x10000, not at the IDF default 0x8000.
      # Without this the firmware installs but cannot find its partitions at boot.
      CONFIG_PARTITION_TABLE_OFFSET: "0x10000"

ota:
  - id: !extend ota_esphome # the entry of core/ota.yaml, which the project includes
    allow_partition_access: true
