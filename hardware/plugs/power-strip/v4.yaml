# Purpose:       Shelly Power Strip 4 Gen4 hardware: ESP32-C6, 4 relays, 4 buttons, 2x ADE7953 metering (SPI), WS2812 ring split into 4 outlet LEDs.
# Requires:      i18n/en.yaml
# Chip:          esp32-c6
# Substitutions: none
#
# Pins: the SPI bus and the chip selects match the stock firmware's boot log (SPI2 init, CS0/1/2: 15/10/-1). Relays, buttons, the ADE7953
# interrupts and the LED ring are the pins of the owner's working config. Outlets, buttons, LEDs and the metering were not checked
# beyond that. Outlets 1+2 are measured by the first ADE7953, outlets 3+4 by the second.
esphome:
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.flash_size: 8MB

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

spi:
  - id: spi_bus
    clk_pin: GPIO13
    mosi_pin: GPIO11
    miso_pin: GPIO12

sensor:
  - platform: ade7953_spi
    id: ade7953_0
    cs_pin: GPIO15    # outlets 1+2
    irq_pin: GPIO6
    update_interval: 10s
    voltage:
      name: ${txt_strip_voltage}
    frequency:
      name: ${txt_strip_frequency}
    current_a:
      name: ${txt_strip_outlet} 1 ${txt_strip_current}
    current_b:
      name: ${txt_strip_outlet} 2 ${txt_strip_current}
    active_power_a:
      name: ${txt_strip_outlet} 1 ${txt_strip_power}
    active_power_b:
      name: ${txt_strip_outlet} 2 ${txt_strip_power}

  - platform: ade7953_spi
    id: ade7953_1
    cs_pin: GPIO10    # outlets 3+4
    irq_pin: GPIO7
    update_interval: 10s
    voltage:
      name: ${txt_strip_voltage} 2
      internal: true
    frequency:
      name: ${txt_strip_frequency} 2
      internal: true
    current_a:
      name: ${txt_strip_outlet} 3 ${txt_strip_current}
    current_b:
      name: ${txt_strip_outlet} 4 ${txt_strip_current}
    active_power_a:
      name: ${txt_strip_outlet} 3 ${txt_strip_power}
    active_power_b:
      name: ${txt_strip_outlet} 4 ${txt_strip_power}

switch:
  - platform: gpio
    id: relay_0
    name: ${txt_strip_outlet} 1
    pin: GPIO4
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:power-socket-eu
  - platform: gpio
    id: relay_1
    name: ${txt_strip_outlet} 2
    pin: GPIO2
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:power-socket-eu
  - platform: gpio
    id: relay_2
    name: ${txt_strip_outlet} 3
    pin: GPIO3
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:power-socket-eu
  - platform: gpio
    id: relay_3
    name: ${txt_strip_outlet} 4
    pin: GPIO1
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:power-socket-eu

binary_sensor:
  - platform: gpio
    id: button_0
    name: ${txt_strip_button} 1
    internal: true
    pin:
      number: GPIO20
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay_0
  - platform: gpio
    id: button_1
    name: ${txt_strip_button} 2
    internal: true
    pin:
      number: GPIO22
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay_1
  - platform: gpio
    id: button_2
    name: ${txt_strip_button} 3
    internal: true
    pin:
      number: GPIO23
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay_2
  - platform: gpio
    id: button_3
    name: ${txt_strip_button} 4
    internal: true
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay_3

# 12 WS2812 LEDs, three per outlet. The strip itself is internal; the four partitions are what other packages can address.
light:
  - platform: esp32_rmt_led_strip
    id: led_strip
    name: ${txt_strip_led_strip}
    pin: GPIO18
    num_leds: 12
    chipset: WS2812
    channel_colors: GRB
    default_transition_length: 0s
    internal: true
  - platform: partition
    id: led_outlet_0
    name: ${txt_strip_outlet} 1 ${txt_strip_led}
    internal: true
    segments:
      - id: led_strip
        from: 0
        to: 2
  - platform: partition
    id: led_outlet_1
    name: ${txt_strip_outlet} 2 ${txt_strip_led}
    internal: true
    segments:
      - id: led_strip
        from: 3
        to: 5
  - platform: partition
    id: led_outlet_2
    name: ${txt_strip_outlet} 3 ${txt_strip_led}
    internal: true
    segments:
      - id: led_strip
        from: 6
        to: 8
  - platform: partition
    id: led_outlet_3
    name: ${txt_strip_outlet} 4 ${txt_strip_led}
    internal: true
    segments:
      - id: led_strip
        from: 9
        to: 11
