# Purpose:       <one line: which device / revision this adoptable config is for>
# Requires:      core/api.yaml, core/ota.yaml, <revision file>, i18n/en.yaml
# Chip:          <set by the revision file>
# Substitutions: none
#
# Replace OWNER, <name> and the tag. All @refs must use the same release tag, never @main.
esphome:
  name: <name>
  project:
    name: "ioxys.<name>"
    version: "0.0.0"

dashboard_import:
  package_import_url: github://OWNER/esphome-configs/projects/<name>.yaml@v0.0.0
  import_full_config: false

packages:
  api: github://OWNER/esphome-configs/core/api.yaml@v0.0.0
  ota: github://OWNER/esphome-configs/core/ota.yaml@v0.0.0
  i18n_base: github://OWNER/esphome-configs/i18n/en.yaml@v0.0.0
  # i18n_lang: github://OWNER/esphome-configs/i18n/de.yaml@v0.0.0   # remove = English
